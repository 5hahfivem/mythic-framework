# Staff Permissions
#
# Owner / Admin / Staff are granted through ACE principals rather than the database.
# Levels: Owner = 100, Admin = 75, Staff = 50

add_ace group.owner mythic.owner allow
add_ace group.admin mythic.admin allow
add_ace group.staff mythic.staff allow

# Inheritance - an Owner is also an Admin, an Admin is also Staff
add_principal group.owner group.admin
add_principal group.admin group.staff

# Command Access
add_ace group.staff command allow
add_ace group.admin command allow
add_ace group.owner command allow

